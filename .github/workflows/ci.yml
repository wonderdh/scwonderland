name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # service-role 키 클라이언트가 클라이언트 번들로 새지 않는지 정적 검증
      - name: Check admin client imports
        run: pnpm check:admin-imports

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      # 현재 react-hooks/set-state-in-effect 등 기존 위반 18건이 남아 있어 비차단으로 둔다.
      # 백로그를 정리한 뒤 continue-on-error 를 제거해 차단 게이트로 승격할 것.
      - name: Lint (non-blocking until backlog cleared)
        run: pnpm lint
        continue-on-error: true
