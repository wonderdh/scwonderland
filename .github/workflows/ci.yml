name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:migration-danger 가 base 커밋과 diff 를 뜸

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # service-role 키 클라이언트가 클라이언트 번들로 새지 않는지 정적 검증
      - name: Check admin client imports
        run: pnpm check:admin-imports

      # "use server" export 함수마다 verify* 가드 또는 @auth-skip 마커가 있는지 검증
      - name: Check server action auth guards
        run: pnpm check:action-auth

      # 새 마이그레이션에 drop policy / to anon 등 위험 구문이 있으면 `-- reviewed-by:` 필수
      - name: Check migration danger markers
        env:
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: pnpm check:migration-danger

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # 조립(번들·프리렌더) 자체가 깨지는지. Supabase 는 더미 값 — 빌드 시점엔 접속 안 함
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
        run: pnpm build
